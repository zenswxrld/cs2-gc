name: Complete portable mod ZIP
on:
  push:
    branches: [codex/drag-drop-release, codex/fix-fresh-profile-init, codex/collection-detail-review, codex/themed-collections-batch-two, codex/remaining-collection-rebuilds]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build/Release" -DBUILD_TESTING=ON -DCS2_GC_BUILD_PROXY=ON -DCS2_GC_DEBUG_TOOLS=ON -DCS2_GC_PROXY_DEF="$PWD/data/steam_api64_exports.def"
      - name: Build Windows binaries
        shell: msys2 {0}
        run: cmake --build build -j 2
      - name: Run core and helper checks
        shell: msys2 {0}
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Report failing tests as annotations
        if: failure()
        run: python -c "import pathlib,re;t=pathlib.Path('build/Testing/Temporary/LastTest.log').read_text(errors='replace');f=pathlib.Path('build/Testing/Temporary/LastTestsFailed.log');print('::error::failed tests: '+(f.read_text().replace(chr(10),' ') if f.exists() else '?'));hits=[l.strip()[:300] for l in t.splitlines() if re.search(r'FAIL|Error|Traceback|assert|Exception',l)];[print('::error::'+h) for h in hits[:9]]"
      - name: Package complete ZIP and smoke-test bundled runtime
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: CS2GC-Portable-25966348
          path: |
            dist/CS2GC-Portable-25966348.zip
            dist/CS2GC-Portable-25966348.zip.sha256
