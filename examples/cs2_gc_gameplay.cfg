# Copy beside steam_api64.dll as cs2_gc_gameplay.cfg.
# Restart CS2 after editing. Integers only; booleans 0/1.
# This file changes local gameplay policy. It never resets saved inventory or balances.

# Automatically run the rewards bridge quietly with local -insecure CS2; exits when CS2 closes.
# Requires installed Python 3 and the bundled helper files. Errors: cs2_gc_rewards.log.
rewards_auto_start = 1

# Profile / Armory progression. A headshot adds XP on top of the kill reward.
# Profile remains 5000 XP/level, ranks 1-40. Each pass caps at 40 stars, 5 active passes.
xp_enabled = 1
stars_enabled = 1
armory_xp_per_star = 400 # 1..100000; UI progress scales to match; existing pass fraction is retained
# 1 = a finished Armory Pass (40 stars) starts over by itself, extra XP carried over; 0 = buy a new pass.
armory_pass_auto_renew = 1
kill_xp = 5
plant_xp = 25
defuse_xp = 25
kill_stars = 2
headshot_stars = 2 # extra stars on top of the kill reward
mvp_stars = 5
plant_stars = 5
defuse_stars = 5
match_complete_stars = 50
headshot_xp = 3
mvp_xp = 25
match_complete_xp = 600
# Plants / defuses are not reliably attributed by the GSI bridge yet.

# Every completed bot match: this many guaranteed drops, each independently case or skin.
match_drops_enabled = 1
match_drop_count = 3 # 1..20
match_case_percent = 50 # 0..100; remaining percent is weapon skins
match_skin_min_rarity = 3 # 3 blue, 4 purple, 5 pink, 6 red; golds excluded

# Output StatTrak chance is the fraction of StatTrak inputs. Gloves cannot be StatTrak.
mixed_stattrak_tradeups = 1 # auto-prepares native shared recipes; restart once after first install
souvenir_tradeups = 1 # local souvenir-only contracts; result stays Souvenir; applied stickers do not transfer
# 0 removes our recipe search path and requires homogeneous inputs after a restart.
# The original schema remains unchanged; generated override: game/cs2_gc_native/scripts/items/items_game.txt.
# Dedicated gameinfo.gi mount line is backed up and only our line is removed on disable.

# Saved shared case-gold counter; separate per-type terminal top-reward counters.
# Soft pity rises quadratically from the specified opening through the hard guarantee.
pity_enabled = 1
pity_soft_at = 70 # 2..99; quadratic ramp, strictly below hard_at
pity_hard_at = 100 # 3..100
case_gold_per_10000 = 26 # 0.26% base; also Dead Hand terminal gold base
terminal_top_per_10000 = 64 # 0.64% base for terminals without golds (Genesis Covert)

# Random Armory collections/packs only; independent saved counter per loot list.
armory_pity_enabled = 1
armory_pity_soft_at = 70
armory_pity_hard_at = 100
armory_top_per_10000 = 50 # at least 0.50% for the highest available tier; never lowers a higher base

terminals_enabled = 1
terminal_default_offers = 5 # 1..100, used when client does not supply volatile_limit
terminal_lifetime_days = 7 # 1..365, applied on newly unsealed terminals only
terminal_helper_enabled = 1 # optional developer transport; native Store purchases do not depend on this switch

# Store prices remain free/local. Native checkout and rank-panel visibility require live testing.
# Native scoreboard/confirmation overrides are prepared from your installed VPK; restart once.

# UTC-aligned per-category native Armory rotation. One entry per category is visible.
# The helper prepares matching catalogue/UI overrides; restart after preparation.
armory_rotation_enabled = 1
armory_rotation_seconds = 900 # 15 minutes, range 10..86400
armory_rotation_slots = 6 # legacy uncategorised-schema fallback only; native catalogue has six category slots
armory_rotation_enforce = 0 # legacy fallback: 1 rejects expired buys; generated category slots always enforce rotation
# The helper regenerates UI/schema after config changes. Restart again to load the new files.

# Local Premier-style rating, not Valve's private formula. Profile level/XP is separate.
# GSI bridge tracks competitive-mode results only with valid final T/CT scores.
# Native rank cache/scoreboard are included for testing; end-match screens and automatic bot skill are pending.
# The background helper writes cs2_gc_premier_bots.cfg; exec it BEFORE spawning bots.
premier_enabled = 1
premier_scoreboard = 1 # generate native scoreboard override; restart once after preparation
premier_bot_badges = 1 # bots mirror your local Premier badge; cosmetic, not separate earned bot ranks
bot_fake_ping = 1 # scoreboard shows a steady fake ping for bots instead of BOT (needs premier_scoreboard = 1)
bot_random_names = 1 # bots get random player-style names, reshuffled each time cs2_gc_debug.exe starts
level_drops_enabled = 1 # every newly earned profile level, no weekly cooldown; match drops stay separate
level_drop_count = 3 # uses the same case/blue+ skin split as match drops
skip_container_confirmation = 1 # first Open click starts animation; restart after override preparation
hide_rent_button = 1 # hide Open to Rent on local containers
premier_placement_wins = 10 # rating stays hidden until this many wins
premier_start_rating = 1000
premier_win_rating = 300
premier_loss_rating = 100
premier_max_rating = 35000
# Extra placement wins to grant, as a running TOTAL. Each counts as a normal win (with its rating gain).
# The helper applies only the difference from what it already granted, once, and remembers it:
#   0 -> 8 grants 8 wins; later raising it to 9 grants 1 more; lowering it never removes wins.
# Example: you have 1 win and want to see the rating after one more game: set 8 (then 9/10, one more win reveals it).
premier_bonus_wins = 0

# Howl: existing CS2 Contraband skin, rotating in the native limited-item group.
armory_howl_enabled = 1 # rotates in and out with regular Armory goods when rotation is enabled
armory_howl_star_price = 250 # values below 250 are raised to 250; max 1000000, local stars; normal, random wear/pattern, no StatTrak

# Expanded native Armory: visible groups per category (0 disables that category).
armory_collection_slots = 3
# Viewmodel limits (like OfflineCS): viewmodel_offset_x/y/z may go this many percent of the normal range
# (250 = 2.5x: x -5..6.25, y/z -5..5); viewmodel_fov between the two values. 100 / 60 / 68 = stock CS2.
viewmodel_range_percent = 250
viewmodel_fov_min = 40
viewmodel_fov_max = 90
knife_finishes = 1 # knife recolours + the knife-only Black Market Case (Armory limited slot); 0 removes them
glove_finishes = 1 # glove recolours + 4 unreleased glove finishes in the glove-only Gauntlet Case (limited slot); 0 removes them
custom_cases = 0 # 1 adds the custom gun collections (Armory rotation, match drops, trade-ups); their skins take a long first launch and lots of disk space. Off by default; knife and glove cases are separate (knife_finishes / glove_finishes)
custom_collection_tradeups = 1 # custom collections count as collections in the trade-up screen (named via the English language override); 0 removes that
custom_collections = 0 # 1 puts the custom Doppler / Spectrum / Knife Classics collections in the Armory rotation
custom_skins_test = 1 # grant-only Custom Skins Test Case (knife finishes and recolours on guns); 0 removes it
black_market_price = 100 # Black Market Case price in stars (always more than the best knife/glove sale)
skip_key_selection = 1 # Open on a local case with one matching key goes straight to the unlock screen
free_case_keys = 1 # local cases open without generating keys # 1: every case gets a free matching key that is never used up (no key purchase); 0: keys as normal
armory_charm_slots = 2 # 3 charms + the agent fill the 4-tile top row
armory_sticker_slots = 2
armory_case_slots = 2
armory_capsule_slots = 2
armory_limited_slots = 1
armory_agent_slots = 1
armory_agent_price = 25

# Match and level weapons: only newer non-case weekly collections, blue and above.
match_weekly_pool_only = 1

# OfflineCS-style native sales. These are the most an item can sell for: on load, values are lowered until no
# Armory purchase (case + free key, terminal best offer, collection, souvenir, sticker/capsule, charm, agent) or
# trade-up returns more than sell_max_return_percent of its price on average, counting pity at its long-run rate
# and the best wear. Frequent pity (low *_pity_soft_at) or cheap cases/terminals therefore lower sale values;
# higher Armory prices raise them back towards these numbers. Defaults sell for about half the price on average.
sell_max_return_percent = 90 # 1..95
item_sales_enabled = 1
sell_consumer = 1
sell_industrial = 2
sell_mil_spec = 5
sell_restricted = 10
sell_classified = 25
sell_covert = 50
sell_knife_glove = 72
sell_sticker_percent = 50 # cap: never more than this percent of the weapon value of the same rarity
sell_sticker_mil_spec = 2
sell_sticker_restricted = 5
sell_sticker_classified = 12
sell_sticker_covert = 25
sell_music_kit = 10
sell_container_percent = 30
sell_agent_percent = 50

# Rating jitter around configured win/loss gains; stable individual bot offsets.
premier_rating_variation = 79
premier_bot_spread = 1200
# Native rewards/rating tab; stock XP animation remains separate.
end_match_screens = 1

# Offline results display and local server restart delay (seconds).
end_match_duration = 20
match_end_delay = 45

# Dedicated rotating terminal offer.
armory_terminal_slots = 1
armory_terminal_price = 10
armory_case_price = 5 # weapon cases in the Armory

# Keyless souvenir packages rotate in the bottom-left tile.
armory_souvenir_slots = 1
armory_souvenir_price = 5

# Hide the engine-added [BOT] name prefix on the offline scoreboard.
bot_hide_tag = 1
# Hide the RUSH promotion, retaining the mission tile.
hide_mainmenu_promo = 1

# Native care package: four saved offers, choose three, one per profile level gained.
# Matches give no direct drops while this is on (the rewards come from the packages).
care_packages_enabled = 1
# 1 = also queue a package after every finished match (off: level-ups only).
care_packages_from_matches = 0
# Combined custom-case probability within case offers; 100 = 1%, split between enabled custom cases.
reward_rare_case_per_10000 = 100

# Route recurring mission clicks into local bot matches; progress/rewards are separate work.
offline_mission_launch = 1

# Add white, black and inverted structural-panel variants alongside accent-only glove recolours.
# 0 stops those variants dropping; previously known variants remain renderable.
glove_panel_variants = 1

# Rarity-specific charm values; blue is capped below its 3-star purchase price.
sell_charm_mil_spec=1
sell_charm_restricted=3
sell_charm_classified=9
sell_charm_covert=25
# Wear multipliers (%) for finished weapons/gloves.
sell_wear_enabled=1
sell_wear_fn=125
sell_wear_mw=110
sell_wear_ft=100
sell_wear_ww=80
sell_wear_bs=60

custom_collection_drop_percent = 15 # share of weapon reward slots from the two drop-only collections; 0 disables

# Profile XP boost only; Armory/star earning stays unchanged.
profile_xp_percent = 125
